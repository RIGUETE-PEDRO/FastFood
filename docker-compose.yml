services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FLASHFOOD_IMAGE:?Defina FLASHFOOD_IMAGE no arquivo .env}
    container_name: laravel_flashfood
    working_dir: /app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: off
      XDEBUG_CONFIG: client_host=192.168.65.254 client_port=9003 idekey=VSCODE
      XDEBUG_SESSION: VSCODE
      PHP_IDE_CONFIG: serverName=FlashFoodDocker
    volumes:
      - app_storage:/app/storage
      # Fotos enviadas ficam no host e não são perdidas ao recriar o container.
      - ${FLASHFOOD_UPLOADS_PATH:-./uploads/produtos}:/app/public/img/produtos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "set -e; mkdir -p public/img/produtos; cp -an public/img/produtos-seed/. public/img/produtos/ 2>/dev/null || true; test -f vendor/autoload.php || composer install; php artisan reverb:start --host=0.0.0.0 --port=8080 & exec php artisan serve --host=0.0.0.0 --port=8000"

  web:
    image: nginx:1.27-alpine
    container_name: nginx_flashfood
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: FlashFood

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql

  node:
    image: node:22
    container_name: node_FlashFood
    working_dir: /app
    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    # O Vite em modo dev aponta os assets para localhost:5173, que não existe
    # para visitantes externos. Gere os assets estáticos antes de subir o Laravel.
    command: sh -c "npm ci --ignore-scripts && rm -f public/hot && npm run build"

  cypress:
    build:
      context: .
      dockerfile: Dockerfile
      target: cypress
    image: flashfood-cypress:15.18.0
    container_name: cypress_FlashFood
    working_dir: /app
    profiles:
      - test
    depends_on:
      - app
      - db
      - node
    environment:
      CYPRESS_BASE_URL: http://app:8000
      CYPRESS_DB_HOST: db
      CYPRESS_DB_PORT: 3306
      CYPRESS_DB_DATABASE: FlashFood
      CYPRESS_DB_USERNAME: root
      CYPRESS_DB_PASSWORD: root
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: FlashFood
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "npm ci && npx cypress run"

  cypress-browser:
    build:
      context: .
      dockerfile: Dockerfile
      target: cypress-browser
    image: flashfood-cypress-browser:15.18.0
    container_name: cypress_browser_FlashFood
    working_dir: /app
    profiles:
      - browser
    depends_on:
      - app
      - db
      - node
    environment:
      CYPRESS_BASE_URL: http://app:8000
      CYPRESS_DB_HOST: db
      CYPRESS_DB_PORT: 3306
      CYPRESS_DB_DATABASE: FlashFood
      CYPRESS_DB_USERNAME: root
      CYPRESS_DB_PASSWORD: root
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: FlashFood
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:6080:6080"
    entrypoint: ["/usr/local/bin/cypress-browser-entrypoint"]


  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  db_data:
  app_storage:
